<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#143D24">
  <title>ArtsDominos v2 — Playing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body class="game-body">

  <!-- ===== TOP BAR ===== -->
  <header class="game-topbar" id="game-topbar">

    <div class="topbar-player opponent-side" id="topbar-opponent">
      <div class="topbar-portrait-wrap">
        <img class="topbar-portrait" id="opp-portrait" src="assets/characters/silhouette.svg" alt="Opponent">
        <div class="topbar-hand-count" id="opp-hand-count">10</div>
      </div>
      <div class="topbar-info">
        <div class="topbar-name" id="opp-name">Opponent</div>
        <div class="topbar-score-wrap">
          <span class="topbar-score-label">Score</span>
          <span class="topbar-score" id="opp-score">0</span>
        </div>
      </div>
    </div>

    <div class="topbar-center">
      <div class="turn-indicator" id="turn-indicator">
        <span class="turn-arrow" id="turn-arrow">&#9654;</span>
        <span class="turn-name" id="turn-name">Your Turn</span>
      </div>
      <div class="round-badge" id="round-badge">
        <span id="round-num">Round 1</span> · <span id="format-badge">Single Round</span>
      </div>
    </div>

    <div class="topbar-player your-side">
      <div class="topbar-info right-align">
        <div class="topbar-name">You</div>
        <div class="topbar-score-wrap">
          <span class="topbar-score-label">Score</span>
          <span class="topbar-score" id="your-score">0</span>
        </div>
      </div>
      <div class="topbar-portrait-wrap">
        <img class="topbar-portrait you-avatar" src="assets/characters/silhouette.svg" alt="You">
        <div class="topbar-hand-count you-count" id="your-hand-count">10</div>
      </div>
    </div>

    <button class="game-menu-btn" onclick="GameUI.togglePause()" title="Menu">&#9776;</button>
  </header>

  <!-- ===== OPPONENT TABLE AREA (tile backs visible above board) ===== -->
  <!--
    Shows the backs of every non-human player's tiles.
    1v1:      one row at the top  (seat-north = the opponent)
    4-player: north row = partner, side strips = opp1 (east) and opp2 (west)
  -->
  <div class="opp-table-zone" id="opp-table-zone">

    <!-- NORTH seat: 1v1 opponent OR 4-player partner -->
    <div class="seat-row seat-north" id="seat-north">
      <span class="seat-tag" id="seat-north-tag"></span>
      <div class="tile-backs-row" id="backs-north"></div>
    </div>

  </div>

  <!-- Opponent speech bubble -->
  <div class="opp-quote-bubble hidden" id="opp-quote"></div>

  <!-- ===== GAME SCENE: side zones + board ===== -->
  <div class="game-scene" id="game-scene">

    <!-- WEST seat (4-player only, opp2) -->
    <div class="seat-side seat-west hidden" id="seat-west">
      <span class="seat-tag seat-tag-vert" id="seat-west-tag"></span>
      <div class="tile-backs-col" id="backs-west"></div>
    </div>

    <!-- CENTER: table rail + canvas -->
    <div class="board-outer" id="board-outer">
      <div class="table-far-rail"></div>
      <main class="board-wrap" id="board-wrap">
        <canvas id="game-canvas"></canvas>
        <div class="board-hint" id="board-hint">Tap a tile in your hand, then tap where to place it</div>
      </main>
    </div>

    <!-- EAST seat (4-player only, opp1) -->
    <div class="seat-side seat-east hidden" id="seat-east">
      <div class="tile-backs-col" id="backs-east"></div>
      <span class="seat-tag seat-tag-vert" id="seat-east-tag"></span>
    </div>

  </div>

  <!-- ===== END SELECTION BAR ===== -->
  <div class="end-select-bar hidden" id="end-select-bar">
    <button class="end-btn" onclick="GameUI.chooseEnd('left')">&#8592; Left</button>
    <span class="end-select-label">Which end?</span>
    <button class="end-btn" onclick="GameUI.chooseEnd('right')">Right &#8594;</button>
  </div>

  <!-- ===== PLAYER HAND ===== -->
  <footer class="hand-area" id="hand-area">
    <div class="hand-scroll-wrap">
      <div class="hand-tiles" id="hand-tiles">
        <!-- Tile elements injected by render.js -->
      </div>
    </div>
    <div class="hand-actions">
      <button class="pass-btn" id="pass-btn" onclick="GameUI.playerPass()" disabled>
        <span class="pass-icon">&#9646;&#9646;</span> Pass
      </button>
      <div class="hand-meta">
        <div class="boneyard-info" id="boneyard-info">
          <span class="boneyard-label">Tiles left</span>
          <span class="boneyard-count" id="boneyard-count">35</span>
        </div>
      </div>
    </div>
  </footer>

  <!-- ===== PAUSE / MENU OVERLAY ===== -->
  <div class="pause-overlay hidden" id="pause-overlay">
    <div class="pause-card">
      <h2>Game Paused</h2>
      <div class="gold-rule"></div>
      <button class="btn-primary" onclick="GameUI.togglePause()">Resume</button>
      <button class="toggle-btn on" id="pause-sfx-btn" onclick="GameUI.toggleSfx()" style="align-self:stretch;border-radius:var(--r-md);padding:10px;">SFX: ON</button>
      <button class="btn-secondary" onclick="GameUI.restartRound()">Restart Round</button>
      <button class="btn-secondary" onclick="window.location.href='index.html'">Main Menu</button>
    </div>
  </div>

  <!-- ===== ROUND RESULT OVERLAY ===== -->
  <div class="result-overlay hidden" id="result-overlay">
    <div class="result-card">
      <div class="result-icon" id="result-icon">&#127881;</div>
      <h2 class="result-title" id="result-title">Round Over!</h2>
      <div class="result-detail" id="result-detail"></div>
      <div class="result-breakdown" id="result-breakdown"></div>
      <div class="result-scores" id="result-scores"></div>
      <div class="gold-rule"></div>
      <button class="btn-primary" id="result-next-btn" onclick="GameUI.nextRound()">Next Round</button>
      <button class="btn-secondary" onclick="GameUI.showRecap(true)">Round Recap</button>
      <button class="btn-secondary" onclick="window.location.href='index.html'">Main Menu</button>
    </div>
  </div>

  <!-- ===== MATCH OVER OVERLAY ===== -->
  <div class="result-overlay hidden" id="match-over-overlay">
    <div class="result-card">
      <div id="streak-fire-banner" class="streak-fire-banner hidden"></div>
      <div class="result-icon" id="match-result-icon">&#127881;</div>
      <h2 class="result-title" id="match-result-title">Match Over!</h2>
      <div class="result-detail" id="match-result-detail"></div>
      <div class="result-breakdown" id="match-result-breakdown"></div>
      <div class="result-scores" id="match-result-scores"></div>
      <div class="gold-rule"></div>
      <button class="btn-primary" onclick="GameUI.rematch()">Rematch</button>
      <button class="btn-secondary" onclick="GameUI.showRecap()">Game Recap</button>
      <button class="btn-secondary" onclick="window.location.href='index.html'">Main Menu</button>
    </div>
  </div>

  <!-- ===== GAME RECAP OVERLAY ===== -->
  <div class="result-overlay hidden" id="recap-overlay">
    <div class="recap-card">
      <h2 class="result-title">Game Recap</h2>
      <div class="gold-rule"></div>
      <pre class="recap-text" id="recap-text"></pre>
      <div class="recap-actions">
        <button class="btn-primary" onclick="GameUI.downloadRecap()">Download .txt</button>
        <button class="btn-secondary" onclick="GameUI.closeRecap()">Close</button>
      </div>
    </div>
  </div>

  <!-- Drag ghost -->
  <canvas id="drag-ghost" style="position:fixed;display:none;pointer-events:none;z-index:200;opacity:0.82;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.7);"></canvas>

  <script src="js/storage.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
